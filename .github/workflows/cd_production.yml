name: CD - Production
run-name: Deploy frontend to Production environment

permissions:
  actions: read
  contents: read

on:
  push:
    tags:
      - v*.*.*

jobs:
  prod_build_deploy:
    name: Build and Deploy to Production Environment
    environment: production
    runs-on: ubuntu-latest
    env:
      DIST: ./dist
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install Yarn globally
        run: npm install -g yarn

      - name: Install dependencies
        run: YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install

      - name: Build the front end
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_APP_VERSION: ${{ github.ref_name }}
          NEWRELIC_ENABLED: true
        run: yarn build

      - name: Save build artifacts
        # if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v6
        with:
          name: yarn_build
          path: ${{ env.DIST }}
          retention-days: 1

      - name: Configure AWS credentials
        id: aws_auth
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Upload website artifacts to S3 bucket
        run: |
          aws s3 sync --delete ${{ env.DIST }} s3://${{ vars.BUCKET }} --region ${{ vars.AWS_REGION }}

      - name: Invalidate cloudfront cache
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*" \
          --region ${{ vars.AWS_REGION }}
